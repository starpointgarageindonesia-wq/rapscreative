name: Publish RAPS Creative to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/publish-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapscreative-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify published files
        shell: bash
        run: |
          test -f public/index.html
          test -f public/harga/index.html
          test -f public/assets/rate-card.css
          test -f public/assets/rate-calculator.js
          test -f wrangler.jsonc
          echo "Static website assets ready."

      - name: Check Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable automatic deployment. Never commit tokens to source code."
            exit 1
          fi

      - name: Publish RAPS Creative static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
